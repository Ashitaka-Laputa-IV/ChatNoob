[project]
name = "chatnoob"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashitaka-Laputa-IV", email = "Ashitaka-Laputa-IV@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-deepseek>=1.1.1",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatnoob = "chatnoob:main"
chatnoob-serve = "chatnoob.api:serve"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
